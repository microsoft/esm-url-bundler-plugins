name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

parameters:
  - name: publishWebpackPlugin
    displayName: 🚀 Publish Webpack Plugin
    type: boolean
    default: false
  - name: publishRollupPlugin
    displayName: 🚀 Publish Rollup Plugin
    type: boolean
    default: false
  - name: publishEsbuildPlugin
    displayName: 🚀 Publish esbuild Plugin
    type: boolean
    default: false

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: esm-url-webpack-plugin
        skipAPIScan: ${{ not(or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))) }}
        workingDirectory: $(Build.SourcesDirectory)/packages/webpack
        testPlatforms: []
        buildSteps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: Install dependencies
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm run build
            displayName: Build packages
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm test -- --testPathPatterns=tests/webpack
            displayName: Run tests
            workingDirectory: $(Build.SourcesDirectory)

        tag: latest
        ghCreateTag: false
        publishPackage: ${{ parameters.publishWebpackPlugin }}
        publishRequiresApproval: false

      - name: rollup-plugin-esm-url
        skipAPIScan: ${{ not(or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))) }}
        workingDirectory: $(Build.SourcesDirectory)/packages/rollup
        testPlatforms: []
        buildSteps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: Install dependencies
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm run build
            displayName: Build packages
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm test -- --testPathPatterns=tests/rollup
            displayName: Run Rollup tests
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm test -- --testPathPatterns=tests/vite
            displayName: Run Vite tests
            workingDirectory: $(Build.SourcesDirectory)

        tag: latest
        ghCreateTag: false
        publishPackage: ${{ parameters.publishRollupPlugin }}
        publishRequiresApproval: false

      - name: esbuild-plugin-esm-url
        skipAPIScan: ${{ not(or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))) }}
        workingDirectory: $(Build.SourcesDirectory)/packages/esbuild
        testPlatforms: []
        buildSteps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            displayName: Install dependencies
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm run build
            displayName: Build packages
            workingDirectory: $(Build.SourcesDirectory)

          - script: npm test -- --testPathPatterns=tests/esbuild
            displayName: Run tests
            workingDirectory: $(Build.SourcesDirectory)

        tag: latest
        ghCreateTag: false
        publishPackage: ${{ parameters.publishEsbuildPlugin }}
        publishRequiresApproval: false
